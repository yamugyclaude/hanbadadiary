<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5b6eff">
<title>내생각정리</title>
<style>
  :root{
    --primary:#5b6eff;
    --primary-dark:#4453d9;
    --bg:#f4f5f9;
    --card:#ffffff;
    --text:#222533;
    --text-light:#8a8da3;
    --border:#e6e8f0;
    --danger:#ff5b5b;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header.topbar{
    padding:max(14px, env(safe-area-inset-top)) 18px 12px;
    background:var(--primary);
    color:#fff;
  }
  header.topbar h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.3px;
  }
  header.topbar p{
    margin:4px 0 0;
    font-size:12.5px;
    opacity:0.85;
  }
  nav.tabs{
    display:flex;
    background:var(--primary);
    padding:0 8px;
    position:sticky;
    top:0;
    z-index:5;
  }
  nav.tabs button{
    flex:1;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.7);
    padding:10px 4px;
    font-size:13.5px;
    font-weight:600;
    border-bottom:3px solid transparent;
    cursor:pointer;
  }
  nav.tabs button.active{
    color:#fff;
    border-bottom-color:#fff;
  }
  main{
    flex:1;
    padding:14px;
  }
  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 1px 4px rgba(20,20,50,0.05);
    border:1px solid var(--border);
  }
  .card h3{margin:0 0 6px; font-size:15px;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--text-light);
    margin:10px 0 6px;
  }
  label:first-child{margin-top:0;}
  textarea, input[type=text], input[type=password], select{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:14.5px;
    font-family:inherit;
    background:#fbfbfd;
    color:var(--text);
    resize:vertical;
  }
  textarea:focus, input:focus, select:focus{
    outline:none;
    border-color:var(--primary);
    background:#fff;
  }
  textarea.main-input{min-height:160px;}
  textarea.report-edit{min-height:160px;}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:10px;
    padding:12px 16px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    min-height:44px;
    width:100%;
  }
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-secondary{background:#eef0fb; color:var(--primary-dark);}
  .btn-outline{background:#fff; color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:#fff; color:var(--danger); border:1px solid #ffd6d6;}
  .btn-row{display:flex; gap:8px; margin-top:10px;}
  .btn-row .btn{width:auto; flex:1;}
  .btn[disabled]{opacity:0.55; pointer-events:none;}

  .hint{font-size:12.5px; color:var(--text-light); line-height:1.6; margin:6px 0 0;}
  .hint a{color:var(--primary);}

  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    margin-right:6px;
    white-space:nowrap;
  }
  .cat-idea{background:#eef2ff; color:#5b6eff;}
  .cat-todo{background:#e7f8ee; color:#1fa15c;}
  .cat-problem{background:#fdeeee; color:#e0524f;}
  .cat-meeting{background:#fff4e3; color:#d3851b;}
  .cat-schedule{background:#eafaf6; color:#13a392;}
  .cat-info{background:#f1f1f6; color:#6b6f85;}
  .cat-etc{background:#f1f1f6; color:#6b6f85;}

  .pri-urgent{background:#ffe1e1; color:#e0302d;}
  .pri-high{background:#ffeede; color:#e0772d;}
  .pri-normal{background:#eef2ff; color:#5b6eff;}
  .pri-low{background:#eef0f3; color:#8a8da3;}

  .empty{
    text-align:center;
    color:var(--text-light);
    font-size:14px;
    padding:50px 20px;
    line-height:1.7;
  }

  .board-item{cursor:pointer;}
  .board-item .meta{font-size:12px; color:var(--text-light); margin-top:6px;}
  .board-item .summary{font-size:13.5px; color:var(--text); margin-top:8px; line-height:1.5;}

  .filter-row{display:flex; gap:8px; margin-bottom:12px;}
  .filter-row select, .filter-row input{margin:0;}
  .filter-row select{flex:0 0 auto; width:auto;}
  .filter-row input{flex:1;}

  /* overlay / modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,20,40,0.45);
    display:flex; align-items:flex-end;
    z-index:50;
  }
  .overlay.hidden{display:none;}
  .sheet{
    background:var(--bg);
    width:100%;
    max-width:480px;
    margin:0 auto;
    max-height:92vh;
    border-radius:18px 18px 0 0;
    overflow-y:auto;
    padding:16px 16px max(16px, env(safe-area-inset-bottom));
  }
  .sheet h2{margin:4px 0 12px; font-size:17px;}

  .report-body h3{font-size:15px; margin:14px 0 6px;}
  .report-body h4{font-size:14px; margin:12px 0 6px;}
  .report-body h5{font-size:13.5px; margin:10px 0 4px;}
  .report-body p{font-size:13.5px; line-height:1.7; margin:4px 0;}
  .report-body ul{margin:4px 0; padding-left:20px;}
  .report-body li{font-size:13.5px; line-height:1.7;}

  .action-list{list-style:none; margin:0; padding:0;}
  .action-list li{
    display:flex; align-items:flex-start; gap:8px;
    font-size:13.5px; padding:6px 0; line-height:1.5;
  }
  .action-list li input[type=checkbox]{
    margin-top:3px; width:18px; height:18px; flex:0 0 auto;
  }
  .action-list li.done span{ text-decoration:line-through; color:var(--text-light); }

  details.raw-text{margin-top:12px; font-size:13px;}
  details.raw-text summary{cursor:pointer; color:var(--primary); font-weight:600;}
  details.raw-text pre{
    white-space:pre-wrap; word-break:break-word;
    background:#fbfbfd; border:1px solid var(--border);
    border-radius:10px; padding:10px; margin-top:8px;
    font-family:inherit; font-size:13px; line-height:1.6;
  }

  /* confirm modal */
  .confirm-overlay{
    position:fixed; inset:0;
    background:rgba(20,20,40,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .confirm-overlay.hidden{display:none;}
  .confirm-box{
    background:#fff; border-radius:14px; padding:20px;
    width:100%; max-width:320px; text-align:center;
  }
  .confirm-box p{font-size:14.5px; line-height:1.6; margin:0 0 16px; white-space:pre-line;}

  .toast{
    position:fixed; left:50%; bottom:max(24px, calc(env(safe-area-inset-bottom) + 16px));
    transform:translateX(-50%);
    background:rgba(30,30,40,0.92); color:#fff;
    padding:10px 18px; border-radius:999px;
    font-size:13.5px; z-index:200;
    transition:opacity 0.25s;
  }
  .toast.hidden{opacity:0; pointer-events:none;}

  .ai-result{margin-top:12px;}
  .field-row{display:flex; gap:8px;}
  .field-row > div{flex:1;}

  .action-item-edit{display:flex; gap:6px; margin-bottom:6px;}
  .action-item-edit input{flex:1;}
  .action-item-edit button{
    flex:0 0 auto; border:none; background:#fbe9e9; color:var(--danger);
    border-radius:8px; width:38px; font-size:16px; cursor:pointer;
  }
  .small-btn{
    border:1px dashed var(--border); background:#fbfbfd; color:var(--text-light);
    border-radius:8px; padding:8px; font-size:13px; width:100%; cursor:pointer; margin-top:2px;
  }

  .spinner{
    display:inline-block; width:14px; height:14px;
    border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    border-radius:50%; animation:spin 0.7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <h1>📝 내생각정리</h1>
    <p>아무 말이나 적으면 AI가 작업하기 좋은 리포트로 정리해드려요</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="write">✍️ 작성</button>
    <button class="tab" data-tab="board">📋 게시판</button>
    <button class="tab" data-tab="settings">⚙️ 설정</button>
  </nav>

  <main>
    <!-- 작성 -->
    <section id="view-write" class="view active">
      <div class="card">
        <label>오늘 떠오른 생각, 메모, 아이디어를 자유롭게 적어보세요</label>
        <textarea id="rawTextInput" class="main-input" placeholder="예) 다음주 화요일 행사 음향장비 점검해야 하고, 마이크 배터리 부족한거 확인 필요. 그리고 거래처에 견적서 다시 보내야 함..."></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" id="btnOrganize">🤖 AI로 정리하기</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-outline" id="btnSaveRaw">📌 정리 없이 메모만 저장</button>
        </div>
        <p class="hint" id="writeHint"></p>
      </div>

      <div id="aiResult" class="ai-result" style="display:none;"></div>
    </section>

    <!-- 게시판 -->
    <section id="view-board" class="view">
      <div class="filter-row">
        <select id="filterCategory">
          <option value="">전체 분류</option>
          <option value="아이디어">아이디어</option>
          <option value="할일">할일</option>
          <option value="문제해결">문제해결</option>
          <option value="회의/미팅">회의/미팅</option>
          <option value="일정">일정</option>
          <option value="정보/메모">정보/메모</option>
          <option value="기타">기타</option>
        </select>
        <input type="text" id="searchInput" placeholder="검색...">
      </div>
      <div id="boardList"></div>
    </section>

    <!-- 설정 -->
    <section id="view-settings" class="view">
      <div class="card">
        <h3>🔑 Gemini API 키</h3>
        <p class="hint">
          AI 정리 기능은 Google Gemini API(무료)를 사용합니다.<br>
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> 에서
          무료로 키를 발급받아 아래에 입력하세요. 키는 이 기기의 브라우저에만 저장되며 외부로 전송되지 않습니다.
        </p>
        <label>API 키</label>
        <input type="password" id="apiKeyInput" placeholder="AIza...로 시작하는 키 입력">
        <label>모델 (변경하지 않아도 됩니다)</label>
        <input type="text" id="modelInput" placeholder="gemini-2.0-flash">
        <div class="btn-row">
          <button class="btn btn-primary" id="btnSaveKey">저장</button>
        </div>
        <p class="hint" id="keyStatus"></p>
      </div>

      <div class="card">
        <h3>💾 데이터 백업</h3>
        <p class="hint">게시판 글은 이 브라우저에만 저장됩니다(localStorage). 브라우저 데이터를 지우면 사라지니 주기적으로 백업해두세요.</p>
        <div class="btn-row">
          <button class="btn btn-outline" id="btnExport">⬇️ 내보내기</button>
          <button class="btn btn-outline" id="btnImport">⬆️ 가져오기</button>
        </div>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
    </section>
  </main>
</div>

<!-- 상세보기 / 수정 -->
<div id="detailOverlay" class="overlay hidden">
  <div class="sheet" id="detailSheet"></div>
</div>

<!-- 확인 모달 -->
<div id="confirmOverlay" class="confirm-overlay hidden">
  <div class="confirm-box">
    <p id="confirmMessage"></p>
    <div class="btn-row">
      <button class="btn btn-outline" id="confirmCancel">취소</button>
      <button class="btn btn-primary" id="confirmOk">확인</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "TO_NOTES_V1";
  const API_KEY_STORAGE = "TO_GEMINI_KEY";
  const MODEL_STORAGE = "TO_GEMINI_MODEL";
  const DEFAULT_MODEL = "gemini-2.0-flash";

  const $ = (sel, root) => (root||document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));

  // ---------- storage helpers ----------
  function loadNotes(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch(e){ return []; }
  }
  function saveNotes(notes){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }
  function getApiKey(){ return localStorage.getItem(API_KEY_STORAGE) || ""; }
  function getModel(){ return localStorage.getItem(MODEL_STORAGE) || DEFAULT_MODEL; }

  // ---------- utils ----------
  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }
  function formatDate(iso){
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function categoryClass(cat){
    return ({
      "아이디어":"cat-idea", "할일":"cat-todo", "문제해결":"cat-problem",
      "회의/미팅":"cat-meeting", "일정":"cat-schedule", "정보/메모":"cat-info"
    })[cat] || "cat-etc";
  }
  function priorityClass(pri){
    return ({
      "긴급":"pri-urgent", "높음":"pri-high", "보통":"pri-normal", "낮음":"pri-low"
    })[pri] || "pri-normal";
  }

  function inlineMd(text){
    let s = escapeHtml(text);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return s;
  }
  function mdToHtml(md){
    if(!md) return "";
    const lines = String(md).split(/\r?\n/);
    let html = "", inList = false;
    for(let raw of lines){
      const line = raw.trim();
      if(!line){ if(inList){ html += "</ul>"; inList=false; } continue; }
      let m;
      if((m = line.match(/^(#{1,4})\s+(.*)/))){
        if(inList){ html += "</ul>"; inList=false; }
        const level = Math.min(m[1].length + 2, 5);
        html += `<h${level}>${inlineMd(m[2])}</h${level}>`;
        continue;
      }
      if((m = line.match(/^[-*]\s+(.*)/))){
        if(!inList){ html += "<ul>"; inList=true; }
        html += `<li>${inlineMd(m[1])}</li>`;
        continue;
      }
      if(inList){ html += "</ul>"; inList=false; }
      html += `<p>${inlineMd(line)}</p>`;
    }
    if(inList) html += "</ul>";
    return html;
  }

  function showToast(msg){
    const el = $("#toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> el.classList.add("hidden"), 2000);
  }

  // ---------- confirm modal ----------
  function confirmAction(message, onOk){
    $("#confirmMessage").textContent = message;
    $("#confirmOverlay").classList.remove("hidden");
    const ok = $("#confirmOk"), cancel = $("#confirmCancel");
    function cleanup(){
      $("#confirmOverlay").classList.add("hidden");
      ok.removeEventListener("click", okHandler);
      cancel.removeEventListener("click", cancelHandler);
    }
    function okHandler(){ cleanup(); onOk(); }
    function cancelHandler(){ cleanup(); }
    ok.addEventListener("click", okHandler);
    cancel.addEventListener("click", cancelHandler);
  }

  // ---------- tab navigation ----------
  function switchTab(name){
    $$(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    $$(".view").forEach(v => v.classList.toggle("active", v.id === "view-"+name));
    if(name === "board") renderBoard();
    if(name === "settings") refreshSettingsView();
  }
  $$(".tab").forEach(btn => btn.addEventListener("click", ()=> switchTab(btn.dataset.tab)));

  // ---------- settings ----------
  function refreshSettingsView(){
    $("#apiKeyInput").value = getApiKey();
    $("#modelInput").value = getModel();
    $("#keyStatus").textContent = getApiKey()
      ? "✅ API 키가 저장되어 있습니다."
      : "⚠️ 아직 API 키가 설정되지 않았습니다. AI 정리 기능을 사용하려면 키를 입력하세요.";
  }
  $("#btnSaveKey").addEventListener("click", ()=>{
    const key = $("#apiKeyInput").value.trim();
    const model = $("#modelInput").value.trim() || DEFAULT_MODEL;
    localStorage.setItem(API_KEY_STORAGE, key);
    localStorage.setItem(MODEL_STORAGE, model);
    refreshSettingsView();
    showToast("저장되었습니다");
  });

  $("#btnExport").addEventListener("click", ()=>{
    const data = JSON.stringify(loadNotes(), null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const pad = n => String(n).padStart(2,"0");
    const d = new Date();
    a.href = url;
    a.download = `thoughts_backup_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
  $("#btnImport").addEventListener("click", ()=> $("#importFile").click());
  $("#importFile").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(reader.result);
        if(!Array.isArray(imported)) throw new Error("invalid");
        confirmAction(`현재 게시판에 ${imported.length}개 항목을 추가합니다. 계속할까요?`, ()=>{
          const notes = loadNotes();
          imported.forEach(n => { if(n && n.id) notes.unshift(n); });
          saveNotes(notes);
          showToast("가져오기 완료");
          renderBoard();
        });
      }catch(err){
        showToast("올바른 백업 파일이 아닙니다");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  // ---------- AI organize ----------
  function buildPrompt(rawText){
    return `당신은 사용자의 두서없는 메모나 생각을 분석해서, 작업하기 좋은 정리 리포트로 만들어주는 비서입니다.
아래 [사용자 메모]를 분석하여 반드시 아래 JSON 형식으로만 응답하세요. 설명, 코드블록 표시 등 다른 텍스트는 절대 포함하지 마세요.

{
  "title": "메모 내용을 한눈에 알 수 있는 짧은 제목 (15자 이내, 한국어)",
  "category": "아이디어|할일|문제해결|회의/미팅|일정|정보/메모|기타 중 하나",
  "priority": "긴급|높음|보통|낮음 중 하나",
  "summary": "핵심 내용을 한두 문장으로 요약 (한국어)",
  "action_items": ["바로 실행할 수 있는 작업 항목들의 배열 (한국어, 없으면 빈 배열)"],
  "report": "마크다운 형식의 정리 리포트. ## 배경, ## 핵심 내용, ## 실행 계획 같은 소제목을 사용해서 한국어로 작성"
}

[사용자 메모]
"""
${rawText}
"""`;
  }

  async function callGemini(rawText){
    const apiKey = getApiKey();
    if(!apiKey){
      throw new Error("NO_API_KEY");
    }
    const model = getModel();
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    const body = {
      contents: [{ parts: [{ text: buildPrompt(rawText) }] }],
      generationConfig: { temperature: 0.4, responseMimeType: "application/json" }
    };
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      let detail = "";
      try{ const errJson = await res.json(); detail = errJson?.error?.message || ""; }catch(e){}
      throw new Error(`API_ERROR_${res.status}${detail ? ": "+detail : ""}`);
    }
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("") || "";
    if(!text) throw new Error("EMPTY_RESPONSE");
    let parsed;
    try{
      parsed = JSON.parse(text);
    }catch(e){
      const match = text.match(/\{[\s\S]*\}/);
      if(match){ parsed = JSON.parse(match[0]); }
      else throw new Error("PARSE_ERROR");
    }
    return {
      title: parsed.title || "제목 없음",
      category: parsed.category || "기타",
      priority: parsed.priority || "보통",
      summary: parsed.summary || "",
      actionItems: Array.isArray(parsed.action_items) ? parsed.action_items.map(t => ({text:String(t), done:false})) : [],
      report: parsed.report || ""
    };
  }

  let currentDraft = null; // {rawText, title, category, priority, summary, actionItems, report}

  $("#btnOrganize").addEventListener("click", async ()=>{
    const rawText = $("#rawTextInput").value.trim();
    if(!rawText){ showToast("내용을 입력해주세요"); return; }
    if(!getApiKey()){
      showToast("설정에서 Gemini API 키를 먼저 입력해주세요");
      switchTab("settings");
      return;
    }
    const btn = $("#btnOrganize");
    const original = btn.innerHTML;
    btn.innerHTML = `<span class="spinner"></span> 정리 중...`;
    btn.disabled = true;
    $("#writeHint").textContent = "";
    try{
      const result = await callGemini(rawText);
      currentDraft = Object.assign({rawText}, result);
      renderDraftPreview();
    }catch(err){
      handleAiError(err);
    }finally{
      btn.innerHTML = original;
      btn.disabled = false;
    }
  });

  function handleAiError(err){
    const msg = err && err.message || "";
    if(msg === "NO_API_KEY"){
      showToast("설정에서 Gemini API 키를 먼저 입력해주세요");
      switchTab("settings");
    }else if(msg.startsWith("API_ERROR_429")){
      $("#writeHint").textContent = "⚠️ 무료 API 호출 한도를 초과했습니다. 잠시 후 다시 시도해주세요.";
    }else if(msg.startsWith("API_ERROR_400") || msg.startsWith("API_ERROR_403")){
      $("#writeHint").textContent = "⚠️ API 키가 올바르지 않거나 권한이 없습니다. 설정을 확인해주세요.";
    }else if(msg === "PARSE_ERROR" || msg === "EMPTY_RESPONSE"){
      $("#writeHint").textContent = "⚠️ AI 응답을 해석하지 못했습니다. 다시 시도해주세요.";
    }else{
      $("#writeHint").textContent = "⚠️ 정리 중 오류가 발생했습니다: " + (msg || "알 수 없는 오류");
    }
  }

  function renderDraftPreview(){
    const d = currentDraft;
    const wrap = $("#aiResult");
    wrap.style.display = "block";
    wrap.innerHTML = `
      <div class="card">
        <h3>🤖 AI 정리 결과 (필요하면 수정 후 저장하세요)</h3>
        <label>제목</label>
        <input type="text" id="draftTitle" value="${escapeHtml(d.title)}">
        <div class="field-row">
          <div>
            <label>분류</label>
            <select id="draftCategory">
              ${["아이디어","할일","문제해결","회의/미팅","일정","정보/메모","기타"].map(c=>
                `<option value="${c}" ${c===d.category?"selected":""}>${c}</option>`).join("")}
            </select>
          </div>
          <div>
            <label>우선순위</label>
            <select id="draftPriority">
              ${["긴급","높음","보통","낮음"].map(p=>
                `<option value="${p}" ${p===d.priority?"selected":""}>${p}</option>`).join("")}
            </select>
          </div>
        </div>
        <label>요약</label>
        <textarea id="draftSummary" rows="2">${escapeHtml(d.summary)}</textarea>
        <label>실행 항목</label>
        <div id="draftActionItems"></div>
        <button type="button" class="small-btn" id="addActionItem">+ 항목 추가</button>
        <label>정리 리포트 (마크다운)</label>
        <textarea id="draftReport" class="report-edit">${escapeHtml(d.report)}</textarea>
        <div class="btn-row">
          <button class="btn btn-secondary" id="btnReorganize">🔄 다시 정리</button>
          <button class="btn btn-primary" id="btnSaveDraft">💾 게시판에 저장</button>
        </div>
      </div>
    `;
    renderActionItemEditors();

    $("#draftTitle").addEventListener("input", e=> currentDraft.title = e.target.value);
    $("#draftCategory").addEventListener("change", e=> currentDraft.category = e.target.value);
    $("#draftPriority").addEventListener("change", e=> currentDraft.priority = e.target.value);
    $("#draftSummary").addEventListener("input", e=> currentDraft.summary = e.target.value);
    $("#draftReport").addEventListener("input", e=> currentDraft.report = e.target.value);
    $("#addActionItem").addEventListener("click", ()=>{
      currentDraft.actionItems.push({text:"", done:false});
      renderActionItemEditors();
    });
    $("#btnReorganize").addEventListener("click", async ()=>{
      const btn = $("#btnReorganize");
      const original = btn.innerHTML;
      btn.innerHTML = `<span class="spinner"></span> 정리 중...`;
      btn.disabled = true;
      try{
        const result = await callGemini(currentDraft.rawText);
        currentDraft = Object.assign({rawText: currentDraft.rawText}, result);
        renderDraftPreview();
      }catch(err){
        handleAiError(err);
      }finally{
        btn.innerHTML = original;
        btn.disabled = false;
      }
    });
    $("#btnSaveDraft").addEventListener("click", ()=>{
      const notes = loadNotes();
      const now = new Date().toISOString();
      notes.unshift({
        id: uid(),
        createdAt: now,
        updatedAt: now,
        rawText: currentDraft.rawText,
        title: currentDraft.title,
        category: currentDraft.category,
        priority: currentDraft.priority,
        summary: currentDraft.summary,
        actionItems: currentDraft.actionItems.filter(a=>a.text.trim()),
        report: currentDraft.report
      });
      saveNotes(notes);
      currentDraft = null;
      $("#aiResult").style.display = "none";
      $("#aiResult").innerHTML = "";
      $("#rawTextInput").value = "";
      showToast("게시판에 저장되었습니다");
      switchTab("board");
    });
  }

  function renderActionItemEditors(){
    const wrap = $("#draftActionItems");
    if(!wrap) return;
    wrap.innerHTML = currentDraft.actionItems.map((item, idx)=>`
      <div class="action-item-edit">
        <input type="text" data-idx="${idx}" class="action-item-input" value="${escapeHtml(item.text)}" placeholder="실행 항목">
        <button type="button" data-idx="${idx}" class="action-item-remove">×</button>
      </div>
    `).join("");
    $$(".action-item-input", wrap).forEach(inp=>{
      inp.addEventListener("input", e=>{
        currentDraft.actionItems[+e.target.dataset.idx].text = e.target.value;
      });
    });
    $$(".action-item-remove", wrap).forEach(btn=>{
      btn.addEventListener("click", e=>{
        currentDraft.actionItems.splice(+e.target.dataset.idx, 1);
        renderActionItemEditors();
      });
    });
  }

  // ---------- save raw without AI ----------
  $("#btnSaveRaw").addEventListener("click", ()=>{
    const rawText = $("#rawTextInput").value.trim();
    if(!rawText){ showToast("내용을 입력해주세요"); return; }
    const notes = loadNotes();
    const now = new Date().toISOString();
    const firstLine = rawText.split(/\r?\n/)[0].slice(0, 30) || "제목 없음";
    notes.unshift({
      id: uid(),
      createdAt: now,
      updatedAt: now,
      rawText: rawText,
      title: firstLine,
      category: "기타",
      priority: "보통",
      summary: "",
      actionItems: [],
      report: rawText
    });
    saveNotes(notes);
    $("#rawTextInput").value = "";
    $("#aiResult").style.display = "none";
    $("#aiResult").innerHTML = "";
    currentDraft = null;
    showToast("메모가 저장되었습니다");
    switchTab("board");
  });

  // ---------- board ----------
  function renderBoard(){
    const notes = loadNotes();
    const cat = $("#filterCategory").value;
    const q = $("#searchInput").value.trim().toLowerCase();
    const filtered = notes.filter(n=>{
      if(cat && n.category !== cat) return false;
      if(q){
        const hay = (n.title+" "+n.summary+" "+n.rawText+" "+n.report).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    const list = $("#boardList");
    if(filtered.length === 0){
      list.innerHTML = `<div class="empty">아직 정리한 메모가 없습니다.<br>✍️ 작성 탭에서 첫 메모를 적어보세요!</div>`;
      return;
    }
    list.innerHTML = filtered.map(n => `
      <div class="card board-item" data-id="${n.id}">
        <span class="badge ${categoryClass(n.category)}">${escapeHtml(n.category)}</span>
        <span class="badge ${priorityClass(n.priority)}">${escapeHtml(n.priority)}</span>
        <h3 style="margin-top:8px;">${escapeHtml(n.title)}</h3>
        ${n.summary ? `<div class="summary">${escapeHtml(n.summary)}</div>` : ""}
        <div class="meta">${formatDate(n.updatedAt)}${n.actionItems && n.actionItems.length ? ` · 실행항목 ${n.actionItems.filter(a=>a.done).length}/${n.actionItems.length}` : ""}</div>
      </div>
    `).join("");
    $$(".board-item", list).forEach(card=>{
      card.addEventListener("click", ()=> openDetail(card.dataset.id));
    });
  }
  $("#filterCategory").addEventListener("change", renderBoard);
  $("#searchInput").addEventListener("input", renderBoard);

  // ---------- detail / edit ----------
  function openDetail(id){
    const notes = loadNotes();
    const note = notes.find(n=>n.id===id);
    if(!note) return;
    renderDetailView(note);
    $("#detailOverlay").classList.remove("hidden");
  }
  function closeDetail(){
    $("#detailOverlay").classList.add("hidden");
    $("#detailSheet").innerHTML = "";
  }

  function renderDetailView(note){
    const sheet = $("#detailSheet");
    sheet.innerHTML = `
      <span class="badge ${categoryClass(note.category)}">${escapeHtml(note.category)}</span>
      <span class="badge ${priorityClass(note.priority)}">${escapeHtml(note.priority)}</span>
      <h2>${escapeHtml(note.title)}</h2>
      <div class="hint">작성: ${formatDate(note.createdAt)}${note.updatedAt!==note.createdAt ? ` · 수정: ${formatDate(note.updatedAt)}` : ""}</div>
      ${note.summary ? `<p style="font-size:14px; line-height:1.6;">${escapeHtml(note.summary)}</p>` : ""}
      ${note.actionItems && note.actionItems.length ? `
        <label>✅ 실행 항목</label>
        <ul class="action-list" id="detailActionList">
          ${note.actionItems.map((a,i)=>`
            <li class="${a.done?"done":""}" data-idx="${i}">
              <input type="checkbox" ${a.done?"checked":""}>
              <span>${escapeHtml(a.text)}</span>
            </li>
          `).join("")}
        </ul>
      ` : ""}
      <label>📄 정리 리포트</label>
      <div class="report-body">${mdToHtml(note.report)}</div>
      <details class="raw-text">
        <summary>원본 메모 보기</summary>
        <pre>${escapeHtml(note.rawText)}</pre>
      </details>
      <div class="btn-row">
        <button class="btn btn-outline" id="btnEdit">✏️ 수정</button>
        <button class="btn btn-danger" id="btnDelete">🗑️ 삭제</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btnCloseDetail">✕ 닫기</button>
      </div>
    `;
    $$("#detailActionList input[type=checkbox]", sheet).forEach(cb=>{
      cb.addEventListener("change", (e)=>{
        const idx = +e.target.closest("li").dataset.idx;
        const notes = loadNotes();
        const n = notes.find(x=>x.id===note.id);
        n.actionItems[idx].done = e.target.checked;
        saveNotes(notes);
        e.target.closest("li").classList.toggle("done", e.target.checked);
      });
    });
    $("#btnCloseDetail").addEventListener("click", closeDetail);
    $("#btnDelete").addEventListener("click", ()=>{
      confirmAction("정말 이 글을 삭제하시겠습니까?\n삭제하면 되돌릴 수 없습니다.", ()=>{
        const notes = loadNotes().filter(n=>n.id!==note.id);
        saveNotes(notes);
        closeDetail();
        renderBoard();
        showToast("삭제되었습니다");
      });
    });
    $("#btnEdit").addEventListener("click", ()=>{
      confirmAction("이 글을 수정하시겠습니까?", ()=>{
        renderEditView(note);
      });
    });
  }

  function renderEditView(note){
    const sheet = $("#detailSheet");
    sheet.innerHTML = `
      <h2>✏️ 글 수정</h2>
      <label>제목</label>
      <input type="text" id="editTitle" value="${escapeHtml(note.title)}">
      <div class="field-row">
        <div>
          <label>분류</label>
          <select id="editCategory">
            ${["아이디어","할일","문제해결","회의/미팅","일정","정보/메모","기타"].map(c=>
              `<option value="${c}" ${c===note.category?"selected":""}>${c}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>우선순위</label>
          <select id="editPriority">
            ${["긴급","높음","보통","낮음"].map(p=>
              `<option value="${p}" ${p===note.priority?"selected":""}>${p}</option>`).join("")}
          </select>
        </div>
      </div>
      <label>요약</label>
      <textarea id="editSummary" rows="2">${escapeHtml(note.summary)}</textarea>
      <label>실행 항목</label>
      <div id="editActionItems"></div>
      <button type="button" class="small-btn" id="editAddActionItem">+ 항목 추가</button>
      <label>정리 리포트 (마크다운)</label>
      <textarea id="editReport" class="report-edit">${escapeHtml(note.report)}</textarea>
      <label>원본 메모</label>
      <textarea id="editRawText" rows="4">${escapeHtml(note.rawText)}</textarea>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btnCancelEdit">취소</button>
        <button class="btn btn-primary" id="btnSaveEdit">저장</button>
      </div>
    `;
    let editActionItems = note.actionItems ? JSON.parse(JSON.stringify(note.actionItems)) : [];
    function renderEditActionItems(){
      const wrap = $("#editActionItems");
      wrap.innerHTML = editActionItems.map((item, idx)=>`
        <div class="action-item-edit">
          <input type="text" data-idx="${idx}" class="edit-action-input" value="${escapeHtml(item.text)}" placeholder="실행 항목">
          <button type="button" data-idx="${idx}" class="edit-action-remove">×</button>
        </div>
      `).join("");
      $$(".edit-action-input", wrap).forEach(inp=>{
        inp.addEventListener("input", e=> editActionItems[+e.target.dataset.idx].text = e.target.value);
      });
      $$(".edit-action-remove", wrap).forEach(btn=>{
        btn.addEventListener("click", e=>{
          editActionItems.splice(+e.target.dataset.idx, 1);
          renderEditActionItems();
        });
      });
    }
    renderEditActionItems();
    $("#editAddActionItem").addEventListener("click", ()=>{
      editActionItems.push({text:"", done:false});
      renderEditActionItems();
    });
    $("#btnCancelEdit").addEventListener("click", ()=> renderDetailView(note));
    $("#btnSaveEdit").addEventListener("click", ()=>{
      confirmAction("수정 내용을 저장하시겠습니까?", ()=>{
        const notes = loadNotes();
        const n = notes.find(x=>x.id===note.id);
        n.title = $("#editTitle").value.trim() || "제목 없음";
        n.category = $("#editCategory").value;
        n.priority = $("#editPriority").value;
        n.summary = $("#editSummary").value;
        n.report = $("#editReport").value;
        n.rawText = $("#editRawText").value;
        n.actionItems = editActionItems.filter(a=>a.text.trim());
        n.updatedAt = new Date().toISOString();
        saveNotes(notes);
        renderDetailView(n);
        renderBoard();
        showToast("수정되었습니다");
      });
    });
  }

  $("#detailOverlay").addEventListener("click", (e)=>{
    if(e.target.id === "detailOverlay") closeDetail();
  });

  // ---------- init ----------
  refreshSettingsView();
})();
</script>
</body>
</html>
