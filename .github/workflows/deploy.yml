name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Auto-increment version
        run: |
          # 현재 날짜 (MMDD 형식)
          TODAY=$(date +%m%d)

          # index.html에서 현재 버전 추출 (v0703-55 형식)
          CURRENT_VERSION=$(grep -oP 'v\d{4}-\d{2}' index.html | head -1)
          CURRENT_DATE=${CURRENT_VERSION:1:4}  # 0703
          CURRENT_NUM=${CURRENT_VERSION:6:2}   # 55

          # 날짜 비교
          if [ "$CURRENT_DATE" = "$TODAY" ]; then
            # 같은 날: 번호만 증가
            NEW_NUM=$(printf "%02d" $((10#${CURRENT_NUM} + 1)))
            NEW_VERSION="v${TODAY}-${NEW_NUM}"
          else
            # 다른 날: 새 날짜로 01부터 시작
            NEW_VERSION="v${TODAY}-01"
          fi

          # index.html 버전 수정
          sed -i "s/v[0-9]\{4\}-[0-9]\{2\}/${NEW_VERSION}/g" index.html

          # git 설정 및 커밋
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add index.html
          git commit -m "auto: version bump to ${NEW_VERSION}" || true
          git push
