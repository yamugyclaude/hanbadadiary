name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-increment version
        run: |
          # 현재 날짜 (MMDD 형식)
          TODAY=$(date +%m%d)

          # index.html에서 현재 버전 추출 (v0703-55 형식)
          CURRENT_VERSION=$(grep -oP 'v\d{4}-\d{2}' index.html | head -1)
          CURRENT_DATE=${CURRENT_VERSION:1:4}  # 0703
          CURRENT_NUM=${CURRENT_VERSION:6:2}   # 55

          # 날짜 비교
          if [ "$CURRENT_DATE" = "$TODAY" ]; then
            # 같은 날: 번호만 증가
            NEW_NUM=$(printf "%02d" $((10#${CURRENT_NUM} + 1)))
            NEW_VERSION="v${TODAY}-${NEW_NUM}"
          else
            # 다른 날: 새 날짜로 01부터 시작
            NEW_VERSION="v${TODAY}-01"
          fi

          # index.html 버전 수정 (배포 전에 반영 — 배포되는 내용과 화면 표시 번호를 일치시킴)
          sed -i "s/v[0-9]\{4\}-[0-9]\{2\}/${NEW_VERSION}/g" index.html

          # git 설정 및 커밋 (이 push는 GITHUB_TOKEN 사용이라 재배포를 트리거하지 않음 — 그래서 이번 배포에 바로 실어감)
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add index.html
          git commit -m "auto: version bump to ${NEW_VERSION}" || true
          git push

      - name: 문서에 평문 비밀번호가 들어갔는지 검사
        run: |
          # 2026-08-05 신설. 문서를 마스킹하는 작업 도중, 사고 경위를 서술하면서
          # 비밀번호를 그대로 인용해 두 번이나 되집어넣는 일이 있었다.
          # 사람 주의력에 맡기지 않고 여기서 막는다.
          # 값을 이 파일에 적으면 그 자체가 노출이므로, 패턴으로만 잡는다.
          if grep -rInE '(pw|PW|암호|비밀번호|password)[^0-9A-Za-z]{0,12}[0-9]{4}([^0-9]|$)' \
               --include='*.md' . ; then
            echo "::error::문서에 평문 비밀번호로 보이는 값이 있습니다. 마스킹 후 다시 배포하세요."
            exit 1
          fi
          echo "✅ 문서 평문 비밀번호 검사 통과"

      - name: Prepare deploy directory (내부 문서 제외)
        run: |
          mkdir -p _site
          cp index.html .nojekyll robots.txt "한바다로고2.png" _site/
          cp -r images pdfs event-request thought-organizer _site/

          # 가드: .md나 .claude가 섞여 들어가면 배포 중단
          if find _site -name '*.md' -o -name '.claude' | grep -q .; then
            echo "::error::_site에 내부 문서(.md 또는 .claude)가 포함되어 배포를 중단합니다."
            find _site -name '*.md' -o -name '.claude'
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
